[package]
name = "hermes-kernel-lab"
version = "0.1.0"
edition = "2024"

[dependencies]
cap-fs-ext = "=3.4.5"
cap-std = "=3.4.5"
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }

tempfile = "3"
